<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>久米川カルチャーセンター</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Share Tech Mono', 'FOT-DNP ShueiGoGinStd', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', monospace, sans-serif;
      background: white;
    }
    canvas { 
      display: block; 
    }
    #info {
      display: none !important;
    }
    #fps-instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Share Tech Mono', 'FOT-DNP ShueiGoGinStd', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', monospace, sans-serif;
      font-size: 14px;
      z-index: 15;
      line-height: 1.5;
    }
    #fps-instructions h3 {
      margin: 0 0 10px 0;
      color: #4fc3f7;
    }
    
    /* Works & Contact Modal共通スタイル */
    #works-modal, #contact-modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    #works-modal .modal-content, #contact-modal .modal-content {
      background-color: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 30px;
      color: white;
    }

    #works-modal .close, #contact-modal .close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      z-index: 10002;
    }

    #works-modal .close:hover, #contact-modal .close:hover {
      color: #4fc3f7;
    }

    /* Works Modal Styles */
    .works-content {
      max-height: 70vh;
      overflow-y: auto;
      padding: 20px 0;
    }
    
    .work-item {
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border-left: 4px solid #4fc3f7;
    }
    
    .work-item h3 {
      color: #4fc3f7;
      margin: 0 0 10px 0;
    }
    
    .work-item p {
      line-height: 1.6;
      margin: 10px 0;
    }
    
    .work-tags {
      margin-top: 15px;
    }
    
    .tag {
      background: #4fc3f7;
      color: #000;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-right: 8px;
      margin-bottom: 5px;
      display: inline-block;
    }
    
    .work-url {
      margin-top: 15px;
    }
    
    .work-url a {
      color: #4fc3f7;
      text-decoration: underline;
      font-size: 14px;
      transition: color 0.3s ease;
    }
    
    .work-url a:hover {
      color: #29b6f6;
    }
    
    /* Contact Modal Styles */
    .contact-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .contact-info h3, .contact-form h3 {
      color: #4fc3f7;
      margin-bottom: 20px;
    }
    
    .contact-method {
      margin-bottom: 20px;
    }
    
    .contact-method h4 {
      color: #fff;
      margin: 0 0 5px 0;
      font-size: 16px;
    }
    
    .contact-method p {
      margin: 0;
      line-height: 1.5;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #fff;
    }
    
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-sizing: border-box;
    }
    
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #4fc3f7;
      background: rgba(255, 255, 255, 0.15);
    }
    
    .submit-btn {
      background: #4fc3f7;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    
    .submit-btn:hover {
      background: #29b6f6;
    }
    
    @media (max-width: 768px) {
      .contact-content {
        grid-template-columns: 1fr;
      }
    }
    
    /* ローディング画面 */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      color: #333;
      font-family: 'Share Tech Mono', 'FOT-DNP ShueiGoGinStd', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', monospace, sans-serif;
    }
    
    .loading-logo {
      width: 120px;
      height: auto;
      margin-bottom: 30px;
      filter: invert(1);
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top: 3px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 18px;
      color: #333;
      margin-bottom: 10px;
    }
    
    .loading-progress {
      font-size: 14px;
      color: #666;
    }
    
    /* BGMコントロール */
    #bgm-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 25;
    }
    
    #bgm-toggle {
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      font-size: 20px;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    #bgm-toggle:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.1);
    }
    #logo {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 20;
      width: auto;
      height: 80px;
    }
    
    #logo img {
      height: 100%;
      width: auto;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.7));
    }
    .menu {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 20;
    }
    .menu a {
      display: inline-block;
      margin: 0 10px;
      padding: 8px 15px;
      background: rgba(0,0,0,0.7);
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .menu a:hover {
      background: rgba(255,255,255,0.8);
      color: #000;
    }
    
    /* マガジンモーダルのスタイルを削除 */
    
    .modal-content {
      background-color: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      width: 80%;
      max-width: 800px;
      max-height: 90%;
      overflow: auto;
      position: relative;
      z-index: 10001;
    }
    
    .modal-header {
      padding: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .modal-header h2 {
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      margin: 0;
    }
    
    .modal-body {
      padding: 20px;
    }
    
    .close-button {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      z-index: 10002;
    }
    
    /* magazine-modal.show スタイルを削除 */
    
    /* ブログ風スタイルを削除 */
  </style>
  <!-- Google Fonts - Share Tech Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Adobe Fonts - FOT-DNP ShueiGoGinStd -->

    (function(d) {
      var config = {

      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
</head>
<body>
  <!-- BGM -->
  <audio id="bgm" loop preload="auto" autoplay muted>
    <source src="bgm.wav" type="audio/wav">
    <source src="bgm.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- ローディング画面 -->
  <div id="loading-screen">
    <img src="クメカルロゴ（白透過） 1.svg" alt="クメカル" class="loading-logo">
    <div class="loading-spinner"></div>
    <div class="loading-text">読み込み中...</div>
    <div class="loading-progress" id="loading-progress">0%</div>
  </div>

  <div id="info"></div>
  <div id="logo">
    <img src="クメカルロゴ（白透過） 1.svg" alt="クメカル">
  </div>
  
  <!-- BGM音量調整 -->
  <div id="bgm-controls">
    <button id="bgm-toggle" onclick="toggleBGM()">🔊</button>
  </div>
  
  <div id="fps-instructions">
    <h3>操作方法</h3>
    <strong>二本指スワイプ</strong> - 視点回転<br>
    <strong>クリック</strong> - オブジェクト操作
  </div>
  
  <!-- メニューを削除 -->
  
  <!-- マガジンモーダルを削除 -->

  <!-- Works Modal -->
  <div id="works-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close" id="close-works">&times;</span>
      <h2>WORKS</h2>
      <div class="works-content" id="works-content">
        <!-- 作品はJSONから動的に読み込まれます -->
      </div>
    </div>
  </div>

  <!-- Contact Modal -->
  <div id="contact-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close" id="close-contact">&times;</span>
      <h2>CONTACT</h2>
      <div class="contact-content">
        <div class="contact-info">
          <h3>お問い合わせ</h3>
          <p>プロジェクトのご相談やコラボレーションのお話など、お気軽にご連絡ください。</p>
          
          <div class="contact-method">
            <h4>📧 Email</h4>
            <p>kumegawaculturecenter@gmail.com</p>
          </div>
          
          <div class="contact-method">
            <h4>📞 電話</h4>
            <p>042-XXX-XXXX</p>
          </div>
          
          <div class="contact-method">
            <h4>📍 住所</h4>
            <p>〒189-XXXX<br>東京都東村山市久米川町X-X-X<br>久米川カルチャーセンター</p>
          </div>
          
          <div class="contact-method">
            <h4>🕒 営業時間</h4>
            <p>平日: 9:00 - 18:00<br>土日: 10:00 - 17:00<br>祝日: 休業</p>
          </div>
        </div>
        
        <div class="contact-form">
          <h3>メッセージを送る</h3>
          <form>
            <div class="form-group">
              <label for="name">お名前</label>
              <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
              <label for="email">メールアドレス</label>
              <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
              <label for="subject">件名</label>
              <input type="text" id="subject" name="subject" required>
            </div>
            
            <div class="form-group">
              <label for="message">メッセージ</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">送信</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
